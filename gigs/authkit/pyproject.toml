[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "provexa-authkit"
version = "0.1.0"
description = "Reusable JWT and Redis-session authentication for FastAPI applications"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
redis = ["redis>=5.0,<6.0"]
fastapi = ["fastapi>=0.115,<1.0", "pydantic>=2.0,<3.0"]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
